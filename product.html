<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | LillyLooks UK</title>
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=/index.html#products">
    <script>
      // Legacy product viewer retired: every product now has a static
      // page at /product/<slug>.html. Send old ?p=<slug> links there.
      (function () {
        var slug = new URLSearchParams(window.location.search).get('p');
        var valid = /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug || '');
        window.location.replace(valid ? '/product/' + slug + '.html' : '/index.html#products');
      })();
    </script>
</head>
<body>
    <p>This product has moved. <a href="/index.html#products">Browse the LillyLooks Edit</a>.</p>
</body>
</html>
